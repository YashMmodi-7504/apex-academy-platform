    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var currentFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
